[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusos"
version = "0.1.0"
description = "Contract-first multi-agent orchestration and skill intelligence infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NexusOS Maintainers" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
nexus = "nexusos.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30"]
runtime = ["langgraph>=0.3"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "httpx2>=2.12",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = { "" = "packages/nexusos-python/src" }

[tool.setuptools.packages.find]
where = ["packages/nexusos-python/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
